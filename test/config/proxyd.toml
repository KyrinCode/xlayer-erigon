[server]
# Host for the proxyd RPC server to listen on.
rpc_host = "0.0.0.0"
# Port for the above.
rpc_port = 8545
# Host for the proxyd WS server to listen on.
ws_host = "0.0.0.0"
# Port for the above
# Set the ws_port to 0 to disable WS
ws_port = 0
# Maximum client body size, in bytes, that the server will accept.
max_body_size_bytes = 10485760
max_concurrent_rpcs = 1000
# Server log level
log_level = "info"
allow_all_origins = true

[redis]
# URL to a Redis instance.
url = ""

[metrics]
# Whether or not to enable Prometheus metrics.
enabled = true
# Host for the Prometheus metrics endpoint to listen on.
host = "0.0.0.0"
# Port for the above.
port = 9761

[cache]
enabled = false
ttl = "1s"

[backend]
# How long proxyd should wait for a backend response before timing out.
response_timeout_seconds = 5
# Maximum response size, in bytes, that proxyd will accept from a backend.
max_response_size_bytes = 10485760
# Maximum number of times proxyd will try a backend before giving up.
max_retries = 3
# Number of seconds to wait before trying an unhealthy backend again.
out_of_service_seconds = 30
# Maximum latency accepted to serve requests, default 10s
max_latency_threshold = "30s"
# Maximum latency accepted to serve requests before degraded, default 5s
max_degraded_latency_threshold = "10s"
# Maximum error rate accepted to serve requests, default 0.5 (i.e. 50%)
max_error_rate_threshold = 0.9
consensus_skip_peer_count = true

[backends]
# A map of backends by name.
[backends.rpc0]
# The URL to contact the backend at. Will be read from the environment
# if an environment variable prefixed with $ is provided.
rpc_url = "http://xlayer-rpc:8545"
max_rps = 3
consensus_skip_peer_count = true

[backend_groups.erigon_in]
backends = ["rpc0"]
routing_strategy = "consensus_aware"
consensus_poller_interval = "100ms"
consensus_max_block_lag = 0
consensus_max_update_threshold = "1s"
consensus_ha = false
consensus_ha_heartbeat_interval = "10ms"

[backend_groups.erigon_woin]
backends = ["rpc0"]
routing_strategy = "consensus_aware"
consensus_poller_interval = "100ms"
consensus_max_block_lag = 0
consensus_max_update_threshold = "1s"
consensus_ha = false
consensus_ha_heartbeat_interval = "10ms"

[backend_groups.erigon_send]
backends = ["rpc0"]
routing_strategy = "consensus_aware"
consensus_poller_interval = "100ms"
consensus_max_block_lag = 0
consensus_max_update_threshold = "1s"
consensus_ha = false
consensus_ha_heartbeat_interval = "10ms"

# Mapping of methods to backend groups.
[rpc_method_mappings]
eth_call = "erigon_woin"
eth_blockNumber = "erigon_woin"
eth_getBalance = "erigon_woin"
eth_sendRawTransaction = "erigon_woin"
eth_getBlockByNumber = "erigon_woin"
eth_getBlockReceipts = "erigon_woin"
eth_getTransactionCount = "erigon_send"
eth_getTransactionReceipt = "erigon_woin"
eth_getBlockByHash = 'erigon_woin'
net_version = "erigon_in"
eth_gasPrice = "erigon_in"
eth_estimateGas = "erigon_in"
eth_chainId = "erigon_in"
eth_getCode = 'erigon_in'
eth_feeHistory = 'erigon_in'
eth_maxPriorityFeePerGas = 'erigon_in'
eth_getTransactionByHash = 'erigon_in'
eth_getLogs = 'erigon_in'
eth_syncing = 'erigon_in'
eth_getInternalTransactions = 'erigon_in'
eth_getBlockTransactionCountByNumber = 'erigon_in'
eth_getStorageAt = 'erigon_in'
eth_minGasPrice = 'erigon_in'
debug_traceTransaction = 'erigon_in'
debug_traceCall = 'erigon_in'
trace_transaction = 'erigon_in'
zkevm_batchNumber = 'erigon_in'
zkevm_virtualBatchNumber = 'erigon_in'
zkevm_verifiedBatchNumber = 'erigon_in'
zkevm_getBatchSealTime = 'erigon_in'
zkevm_getBatchByNumber = 'erigon_in'
zkevm_getLatestGlobalExitRoot = 'erigon_in'
zkevm_getBatchDataByNumbers = 'erigon_in'
zkevm_getExitRootsByGER = 'erigon_in'
txpool_content = 'erigon_in'
web3_clientVersion = 'erigon_in'
zkevm_getBatchWitness = 'erigon_in'
